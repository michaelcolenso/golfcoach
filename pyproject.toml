[project]
name = "golfcoach"
version = "1.0.0"
description = "AI-powered golf swing analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "openai>=1.99",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
]
